name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Install system readers
        run: sudo apt-get update && sudo apt-get install -y ripgrep jq bat
      - name: Install dependencies
        run: npm install
      - name: Unit and security tests
        run: npm test
      - name: Static read-only audit
        run: npm run check
      - name: Mock end-to-end smoke test
        run: npm run smoke:mock
      - name: Package audit
        run: npm pack --dry-run
